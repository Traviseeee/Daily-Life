  <script>
    // light / dark before the first paint, so the opening screen already has the right colours
    (function () {
      var theme = "";
      try {
        theme = localStorage.getItem("mylife:theme") || "";
        if (!theme) { var raw = localStorage.getItem("mylife:user-data:v1") || ""; theme = /"theme"\s*:\s*"dark"/.test(raw) ? "dark" : "light"; }
      } catch (e) { theme = "light"; }
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    })();
  </script>
  <style id="splashStyle">
    /* Opening screen (7 Nov 2026) "time of day": the sky follows the time in Phnom Penh —
       morning sunrise, daytime soft light, night moon + stars — Nomi rises with a greeting
       (អរុណសួស្តី / ទិវាសួស្តី / រាត្រីសួស្តី), then MYLIFE. The part of day is set by the small
       script right after the markup. ~1.6 s, then it fades into the app. */
    html { background: #211d3d; }
    html[data-theme="light"] { background: #F3F1F4; }
    #mylifeSplash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden; color: #2b2370; font-family: "Kantumruy Pro", system-ui, sans-serif; background: linear-gradient(180deg, #7b68ee 0%, #b6a8ff 50%, #f3eeff 100%); transition: opacity .45s ease, transform .45s ease; }
    #mylifeSplash.is-morning { background: linear-gradient(180deg, #9f8cff 0%, #d9ceff 45%, #ffe3ef 100%); }
    #mylifeSplash.is-night { color: #fff; background: linear-gradient(180deg, #120f26 0%, #2a2166 55%, #4b3bb0 100%); }
    #mylifeSplash.is-done { opacity: 0; transform: scale(1.06); pointer-events: none; }
    #mylifeSplash .sp-stack { position: relative; display: grid; justify-items: center; gap: 10px; }
    #mylifeSplash .sp-sky { position: relative; width: 220px; height: 170px; display: grid; place-items: end center; }
    #mylifeSplash .sp-sun { position: absolute; left: 50%; bottom: 30px; width: 110px; height: 110px; margin-left: -55px; border-radius: 50%; opacity: 0; transform: translateY(70px); animation: sp-rise 1s cubic-bezier(.2, 1, .3, 1) .1s forwards; background: radial-gradient(circle, #fff 0, #fff2c4 50%, rgba(255, 255, 255, 0) 72%); }
    #mylifeSplash.is-morning .sp-sun { background: radial-gradient(circle, #fff6d6 0, #ffd27a 55%, rgba(255, 200, 120, 0) 72%); }
    #mylifeSplash.is-night .sp-sun { background: radial-gradient(circle at 38% 38%, #fff 0, #e9e4ff 45%, rgba(230, 224, 255, 0) 70%); }
    #mylifeSplash .sp-nomi { position: relative; width: 130px; height: 130px; overflow: visible; opacity: 0; transform: translateY(20px); animation: sp-up .6s cubic-bezier(.2, 1.4, .4, 1) .55s forwards; }
    #mylifeSplash .sp-nomi .nb-eye { animation: sp-blink 3s 1.4s infinite; transform-origin: center; transform-box: fill-box; }
    #mylifeSplash .sp-stars { position: absolute; inset: 0; display: none; }
    #mylifeSplash.is-night .sp-stars { display: block; }
    #mylifeSplash .sp-stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0; animation: sp-tw 2s ease-in-out infinite; }
    #mylifeSplash .sp-zz { position: absolute; right: 30px; top: 20px; display: none; font-size: 18px; font-weight: 600; opacity: 0; animation: sp-float 2.4s ease 1.2s infinite; }
    #mylifeSplash.is-night .sp-zz { display: block; }
    #mylifeSplash .sp-hello { min-height: 1.5em; font-size: 18px; font-weight: 600; opacity: 0; transform: translateY(8px); animation: sp-up .5s ease .9s forwards; }
    #mylifeSplash .sp-word { display: flex; font-size: 26px; font-weight: 600; letter-spacing: .06em; }
    #mylifeSplash .sp-word span { display: inline-block; opacity: 0; transform: translateY(14px); animation: sp-up .4s ease forwards; }
    #mylifeSplash .sp-tag { font-size: 13px; letter-spacing: .06em; opacity: 0; animation: sp-up .5s ease 1.5s forwards; }
    /* the sign-in sheet waits until the opening screen has finished (it used to pop up over it) */
    #loginModal { transition: opacity .35s ease; }
    body:has(#mylifeSplash:not(.is-done)) #loginModal { opacity: 0 !important; pointer-events: none !important; }
    @keyframes sp-rise { to { opacity: 1; transform: none; } }
    @keyframes sp-up { to { opacity: 1; transform: none; } }
    @keyframes sp-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes sp-tw { 0%, 100% { opacity: 0; } 50% { opacity: .9; } }
    @keyframes sp-float { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 25% { opacity: 1; transform: translate(4px, -10px) scale(1); } 100% { opacity: 0; transform: translate(14px, -50px) scale(.8); } }
    @media (prefers-reduced-motion: reduce) { #mylifeSplash *, #mylifeSplash { animation: none !important; transition: opacity .2s !important; } #mylifeSplash :is(.sp-sun, .sp-nomi, .sp-hello, .sp-word span, .sp-tag) { opacity: 1; transform: none; } }

  <script>
    // App styles load without blocking the first paint (the splash has its own
    // inline style), so iPhone shows the splash at once instead of a white page.
    // App.init waits for them (window.__cssReady).
    window.__cssReady = new Promise(function (resolve) {
      var links = Array.prototype.slice.call(document.querySelectorAll("link[data-app-css]"));
      var left = links.length;
      function done() { left -= 1; if (left <= 0) resolve(); }
      links.forEach(function (link) {
        function apply() { link.media = "all"; done(); }
        if (link.sheet) apply();
        else { link.addEventListener("load", apply, { once: true }); link.addEventListener("error", done, { once: true }); }
      });
      if (!links.length) resolve();
      setTimeout(function () { links.forEach(function (link) { link.media = "all"; }); resolve(); }, 6000);
    });
  </script>

  <script>
    if ("serviceWorker" in navigator && ["http:", "https:"].includes(window.location.protocol)) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .then(registration => registration.update().catch(() => {}))
          .catch(error => console.warn("MYLIFE could not register its service worker.", error));
      });
      // A new version took over: reload right away while the opening screen is up,
      // otherwise the next time the app comes back to the foreground.
      var hadController = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController) { hadController = true; return; }
        if (document.getElementById("mylifeSplash")) { window.location.reload(); return; }
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") window.location.reload();
        });
      });
    }
  </script>
  <script>
    // while the page scrolls, pause the turning background and light sweeps (smoother on phones)
    (function () {
      var root = document.documentElement, timer = 0;
      function on() { if (!timer) root.classList.add("is-scrolling"); clearTimeout(timer); timer = setTimeout(function () { root.classList.remove("is-scrolling"); timer = 0; }, 160); }
      window.addEventListener("scroll", on, { passive: true, capture: true });
      window.addEventListener("touchmove", on, { passive: true });
    })();
  </script>
  <script>
    // Opening screen: at least ~1.8 s (the logo animation), gone once the app has loaded, never longer than 4 s; tap to skip.
    (function () {
      var splash = document.getElementById("mylifeSplash");
      if (!splash) return;
      var MIN = 1800, MAX = 4000;
      function hide() {
        if (splash.dataset.done) return;
        splash.dataset.done = "1";
        setTimeout(function () {
          splash.classList.add("is-done");
          setTimeout(function () { splash.remove(); var st = document.getElementById("splashStyle"); if (st) st.remove(); }, 450);
        }, Math.max(0, MIN - performance.now()));
      }
      if (document.readyState === "complete") hide(); else window.addEventListener("load", hide);
      setTimeout(hide, MAX);
      splash.addEventListener("click", hide);
    })();
  </script>
