  <script>
    // light / dark before the first paint, so the opening screen already has the right colours
    (function () {
      var theme = "";
      try {
        theme = localStorage.getItem("mylife:theme") || "";
        if (!theme) { var raw = localStorage.getItem("mylife:user-data:v1") || ""; theme = /"theme"\s*:\s*"dark"/.test(raw) ? "dark" : "light"; }
      } catch (e) { theme = "light"; }
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    })();
  </script>
  <style id="splashStyle">
    /* Opening screen (31 Oct): Nomi hops in on a lavender glow, then fades into the app.
       Dark = D1 "Lavender Dusk" (indigo), light = lavender like the Home hero. */
    html { background: #211d3d; }
    #mylifeSplash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: radial-gradient(circle 360px at 50% 46%, #5b4bc4 0, #2a2458 55%, #1b1834 100%); color: #F4F2FF; font-family: Inter, "Noto Sans Khmer", system-ui, sans-serif; transition: opacity .42s ease, transform .42s ease; }
    #mylifeSplash .sp-text { position: absolute; left: 0; right: 0; top: calc(50% + 84px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #mylifeSplash.is-done { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #mylifeSplash .sp-nomi { width: 150px; height: 150px; transform: translateY(30px) scale(.6); opacity: 0; animation: sp-hop .7s cubic-bezier(.2, 1.5, .4, 1) .1s forwards, sp-bob 2.4s ease-in-out 1s infinite; }
    #mylifeSplash .sp-nomi .nb-eye { animation: sp-blink 3s 1.2s infinite; transform-origin: center; transform-box: fill-box; }
    #mylifeSplash .sp-word { font-size: 28px; letter-spacing: .04em; opacity: 0; transform: translateY(8px); animation: sp-up .5s ease .6s forwards; }
    #mylifeSplash .sp-word b { color: #C9BDFF; font-weight: 800; }
    #mylifeSplash .sp-word span { font-weight: 500; }
    #mylifeSplash .sp-tag { font-size: 13px; letter-spacing: .08em; color: #bdb7e6; opacity: 0; animation: sp-up .5s ease .85s forwards; }
    #mylifeSplash .sp-dots { display: flex; gap: 6px; margin-top: 6px; opacity: 0; animation: sp-up .4s ease 1s forwards; }
    #mylifeSplash .sp-dots i { width: 7px; height: 7px; border-radius: 50%; background: #B6A8FF; animation: sp-dot 1s ease-in-out infinite; }
    #mylifeSplash .sp-dots i:nth-child(2) { animation-delay: .15s; } #mylifeSplash .sp-dots i:nth-child(3) { animation-delay: .3s; }
    html[data-theme="light"] { background: #F3F1F4; }
    html[data-theme="light"] #mylifeSplash { background: radial-gradient(circle 260px at 72% 30%, rgba(255, 214, 190, .55), transparent 70%), linear-gradient(170deg, #7B68EE, #9F8CFF 55%, #c9bdff); color: #fff; }
    html[data-theme="light"] #mylifeSplash .sp-word b { color: #fff; }
    html[data-theme="light"] #mylifeSplash .sp-tag { color: rgba(255, 255, 255, .88); }
    html[data-theme="light"] #mylifeSplash .sp-dots i { background: #fff; }
    @keyframes sp-hop { to { opacity: 1; transform: none; } }
    @keyframes sp-bob { 50% { transform: translateY(-8px); } }
    @keyframes sp-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes sp-dot { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
    @keyframes sp-up { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #mylifeSplash *, #mylifeSplash { animation: none !important; transition: opacity .2s !important; } #mylifeSplash .sp-nomi, #mylifeSplash .sp-word, #mylifeSplash .sp-tag, #mylifeSplash .sp-dots { opacity: 1; transform: none; } }
  </style>

  <script>
    // App styles load without blocking the first paint (the splash has its own
    // inline style), so iPhone shows the splash at once instead of a white page.
    // App.init waits for them (window.__cssReady).
    window.__cssReady = new Promise(function (resolve) {
      var links = Array.prototype.slice.call(document.querySelectorAll("link[data-app-css]"));
      var left = links.length;
      function done() { left -= 1; if (left <= 0) resolve(); }
      links.forEach(function (link) {
        function apply() { link.media = "all"; done(); }
        if (link.sheet) apply();
        else { link.addEventListener("load", apply, { once: true }); link.addEventListener("error", done, { once: true }); }
      });
      if (!links.length) resolve();
      setTimeout(function () { links.forEach(function (link) { link.media = "all"; }); resolve(); }, 6000);
    });
  </script>

  <script>
    if ("serviceWorker" in navigator && ["http:", "https:"].includes(window.location.protocol)) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .then(registration => registration.update().catch(() => {}))
          .catch(error => console.warn("MYLIFE could not register its service worker.", error));
      });
      // A new version took over: reload right away while the opening screen is up,
      // otherwise the next time the app comes back to the foreground.
      var hadController = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController) { hadController = true; return; }
        if (document.getElementById("mylifeSplash")) { window.location.reload(); return; }
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") window.location.reload();
        });
      });
    }
  </script>
  <script>
    // Opening screen: at least ~1.8 s (the logo animation), gone once the app has loaded, never longer than 4 s; tap to skip.
    (function () {
      var splash = document.getElementById("mylifeSplash");
      if (!splash) return;
      var MIN = 1800, MAX = 4000;
      function hide() {
        if (splash.dataset.done) return;
        splash.dataset.done = "1";
        setTimeout(function () {
          splash.classList.add("is-done");
          setTimeout(function () { splash.remove(); var st = document.getElementById("splashStyle"); if (st) st.remove(); }, 450);
        }, Math.max(0, MIN - performance.now()));
      }
      if (document.readyState === "complete") hide(); else window.addEventListener("load", hide);
      setTimeout(hide, MAX);
      splash.addEventListener("click", hide);
    })();
  </script>
